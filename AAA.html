<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 表格点名器 · 优化版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #2b3f6b;
            --primary-light: #3a4e7c;
            --bg: #eef2fa;
            --card: #ffffff;
            --text: #1a2647;
            --muted: #6b7fa0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f1f5fe 0%, #e6ecf7 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.6);
            padding: 28px 32px;
        }
        h1 {
            font-size: 1.9rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(100,130,200,0.15);
        }
        h1 span {
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 40px;
            background: linear-gradient(135deg, #3a4e7c, #25355c);
        }
        .top-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }
        .file-btn {
            background: #e8eefc;
            color: var(--primary);
            border: 1px solid #c5d5f0;
            border-radius: 30px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .file-btn:hover { background: #dbe6fb; }
        .status-text {
            font-size: 0.88rem;
            color: var(--muted);
            flex: 1;
            min-width: 200px;
        }
        .layout {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 24px;
        }
        /* 表格区 */
        .table-section {
            background: rgba(255,255,255,0.7);
            border-radius: 24px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px 8px;
            color: var(--text);
            font-weight: 500;
        }
        .badges { display: flex; gap: 8px; }
        .badge {
            background: #d0ddef;
            color: var(--text);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge.green { background: #d4f0dd; color: #1f6b3a; }
        .badge.orange { background: #ffe6cc; color: #a35400; }
        .table-wrapper {
            flex: 1;
            max-height: 420px;
            overflow-y: auto;
            border-radius: 20px;
            background: white;
            border: 1px solid #e1e8f5;
            margin: 0 6px 6px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th {
            position: sticky;
            top: 0;
            background: #f4f8ff;
            color: var(--text);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #d4e0f0;
            z-index: 1;
        }
        td { padding: 12px 16px; border-bottom: 1px solid #edf2fa; color: var(--text); }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.15s; cursor: pointer; }
        tbody tr:hover { background: #f0f6ff; }
        tr.picked {
            background: #e0ecff !important;
            box-shadow: inset 4px 0 0 var(--primary);
        }
        tr.already-picked {
            opacity: 0.45;
            text-decoration: line-through;
            text-decoration-color: #8a9bc0;
        }
        .empty-tip {
            text-align: center;
            color: #8a9bc0;
            font-style: italic;
            padding: 50px 20px;
        }
        /* 右侧面板 */
        .pick-panel { display: flex; flex-direction: column; gap: 18px; }
        .result-card {
            background: white;
            border-radius: 32px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 10px 25px -10px rgba(30,40,70,0.25);
            transition: transform 0.15s;
        }
        .result-card.rolling .result-name {
            color: #7a8db8;
            filter: blur(0.3px);
        }
        .result-label {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .result-name {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            word-break: break-word;
            min-height: 3.6rem;
            transition: color 0.2s;
        }
        .result-dept {
            color: #5c6f95;
            font-size: 0.95rem;
            margin-top: 10px;
            background: #eef3fd;
            display: inline-block;
            padding: 5px 16px;
            border-radius: 40px;
        }
        .pick-btn {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 24px -8px #1a2742;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .pick-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 16px 28px -8px #1a2742; }
        .pick-btn:active:not(:disabled) { transform: translateY(1px); }
        .pick-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--muted);
            justify-content: center;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }
        .history-box {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.9);
        }
        .history-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #4d628b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #b13e3e;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .clear-btn:hover { background: #ffeaea; }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
        }
        .history-item {
            background: white;
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--primary);
            border: 1px solid #d9e4f5;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .history-item .idx {
            color: #8a9bc0;
            font-size: 0.7rem;
        }
        .empty-history { color: #9aabca; font-style: italic; font-size: 0.78rem; }
        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7d9e;
        }
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 表格点名器 <span>优化版 · 不重复点名</span></h1>

        <div class="top-bar">
            <label class="file-btn">
                📂 选择 Excel 文件
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
            </label>
            <div class="status-text" id="statusText">请选择 students.xlsx（需包含"姓名"列）</div>
        </div>

        <div class="layout">
            <!-- 左表 -->
            <div class="table-section">
                <div class="table-header">
                    <div>📌 名单</div>
                    <div class="badges">
                        <span class="badge" id="totalBadge">0 人</span>
                        <span class="badge green" id="remainingBadge">剩余 0</span>
                        <span class="badge orange" id="pickedBadge">已点 0</span>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead id="tableHead">
                            <tr><th>姓名</th><th>部门 / 班级</th></tr>
                        </thead>
                        <tbody id="tbody">
                            <tr><td colspan="2" class="empty-tip">请先选择 Excel 文件</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 右侧 -->
            <div class="pick-panel">
                <div class="result-card" id="resultCard">
                    <div class="result-label">被点中的同学</div>
                    <div class="result-name" id="resultName">—</div>
                    <div class="result-dept" id="resultDept">等待抽选</div>
                </div>

                <button class="pick-btn" id="pickBtn" disabled>🎲 随机点名</button>

                <div class="options">
                    <label><input type="checkbox" id="noRepeat" checked> 不重复</label>
                    <label><input type="checkbox" id="voiceOn"> 语音播报</label>
                    <label><input type="checkbox" id="animOn" checked> 滚动动画</label>
                </div>

                <div class="history-box">
                    <div class="history-title">
                        <span>📜 抽选记录</span>
                        <button class="clear-btn" id="clearHistory">清空</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <span class="empty-history">还没有抽选记录</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-note">💡 提示：按 空格 或 回车 也可以点名 · 点击表格行可手动高亮</div>
    </div>

    <script>
    (function() {
        // ============ 状态 ============
        let students = [];          // 全部学生 { name, department, extra: {} }
        let columns = [];           // 额外列名（除姓名、部门外）
        let pickedSet = new Set();  // 已抽过的索引
        let history = [];           // 抽选记录 [{ name, time }]
        let isRolling = false;

        // DOM
        const fileInput   = document.getElementById('fileInput');
        const statusText  = document.getElementById('statusText');
        const tbody       = document.getElementById('tbody');
        const tableHead   = document.getElementById('tableHead');
        const totalBadge  = document.getElementById('totalBadge');
        const remainingBadge = document.getElementById('remainingBadge');
        const pickedBadge = document.getElementById('pickedBadge');
        const pickBtn     = document.getElementById('pickBtn');
        const resultCard  = document.getElementById('resultCard');
        const resultName  = document.getElementById('resultName');
        const resultDept  = document.getElementById('resultDept');
        const historyList = document.getElementById('historyList');
        const noRepeat    = document.getElementById('noRepeat');
        const voiceOn     = document.getElementById('voiceOn');
        const animOn      = document.getElementById('animOn');
        const clearHistory = document.getElementById('clearHistory');

        // ============ 读取 Excel ============
        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            statusText.textContent = '正在读取 ' + file.name + ' ...';

            const reader = new FileReader();
            reader.onload = evt => {
                try {
                    parseWorkbook(new Uint8Array(evt.target.result), file.name);
                } catch (err) {
                    console.error(err);
                    statusText.textContent = '❌ 解析失败：' + err.message;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function parseWorkbook(data, filename) {
            const wb = XLSX.read(data, { type: 'array' });

            // 找第一个有数据的 sheet
            let rows = null, usedSheet = '';
            for (const name of wb.SheetNames) {
                const r = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
                if (r.length > 1) { rows = r; usedSheet = name; break; }
            }
            if (!rows) throw new Error('所有 sheet 都为空');

            // 找表头行（前3行中非空最多的）
            let headerIdx = 0, maxNon = 0;
            for (let i = 0; i < Math.min(3, rows.length); i++) {
                const n = rows[i].filter(c => String(c).trim() !== '').length;
                if (n > maxNon) { maxNon = n; headerIdx = i; }
            }
            const headers = rows[headerIdx].map(h => String(h).trim());

            // 识别姓名列 & 部门列
            const nameKw = ['姓名','名字','学生','name','Name','学员'];
            const deptKw = ['部门','班级','组','班','dept','department','单位','科室','学院','专业'];

            let nameCol = headers.findIndex(h => nameKw.some(k => h.includes(k)));
            let deptCol = headers.findIndex(h => deptKw.some(k => h.includes(k)));
            if (nameCol === -1) nameCol = 0;
            if (deptCol === -1) deptCol = headers.length > 1 ? (nameCol === 0 ? 1 : 0) : -1;

            // 额外列（除姓名、部门外所有非空表头）
            const extraCols = [];
            headers.forEach((h, i) => {
                if (i !== nameCol && i !== deptCol && h) extraCols.push({ index: i, name: h });
            });
            columns = extraCols.map(c => c.name);

            // 解析数据
            students = [];
            for (let i = headerIdx + 1; i < rows.length; i++) {
                const row = rows[i];
                const name = String(row[nameCol] || '').trim();
                if (!name) continue;
                const department = deptCol >= 0 ? String(row[deptCol] || '').trim() : '';
                const extra = {};
                extraCols.forEach(c => {
                    extra[c.name] = String(row[c.index] || '').trim();
                });
                students.push({ name, department, extra });
            }

            if (students.length === 0) throw new Error('未解析到学生数据（姓名列为空）');

            statusText.textContent = `✅ 从【${usedSheet}】读取 ${students.length} 人 · 姓名列「${headers[nameCol]}」` +
                (deptCol >= 0 ? ` · 部门列「${headers[deptCol]}」` : '') +
                (columns.length ? ` · 附加列：${columns.join('、')}` : '');

            resetAll();
            renderTable();
        }

        // ============ 渲染 ============
        function renderTable() {
            // 表头
            tableHead.innerHTML = '';
            const trh = document.createElement('tr');
            trh.innerHTML = `<th>姓名</th><th>部门 / 班级</th>` +
                columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');
            tableHead.appendChild(trh);

            // 表体
            tbody.innerHTML = '';
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="99" class="empty-tip">暂无数据</td></tr>';
                return;
            }

            students.forEach((s, i) => {
                const tr = document.createElement('tr');
                tr.dataset.index = i;
                let html = `<td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.department || '—')}</td>`;
                columns.forEach(c => {
                    html += `<td>${escapeHtml(s.extra[c] || '')}</td>`;
                });
                tr.innerHTML = html;

                if (pickedSet.has(i)) tr.classList.add('already-picked');
                tr.addEventListener('click', () => {
                    document.querySelectorAll('#tbody tr').forEach(r => r.classList.remove('picked'));
                    tr.classList.add('picked');
                });
                tbody.appendChild(tr);
            });
            updateBadges();
        }

        function updateBadges() {
            const total = students.length;
            const picked = pickedSet.size;
            totalBadge.textContent = total + ' 人';
            pickedBadge.textContent = '已点 ' + picked;
            remainingBadge.textContent = '剩余 ' + (noRepeat.checked ? total - picked : total);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[m]));
        }

        // ============ 点名核心 ============
        function getCandidates() {
            if (!noRepeat.checked) {
                return students.map((_, i) => i);  // 全部
            }
            const remain = [];
            students.forEach((_, i) => { if (!pickedSet.has(i)) remain.push(i); });
            return remain;
        }

        function pickRandom() {
            if (isRolling) return;
            const candidates = getCandidates();
            if (candidates.length === 0) {
                resultName.textContent = '🎉 全部点完';
                resultDept.textContent = '点击"清空"或关闭"不重复"继续';
                pickBtn.disabled = false;
                return;
            }

            const targetIdx = candidates[Math.floor(Math.random() * candidates.length)];

            // 滚动动画
            if (animOn.checked) {
                rollAnimation(targetIdx);
            } else {
                finishPick(targetIdx);
            }
        }

        function rollAnimation(targetIdx) {
            isRolling = true;
            pickBtn.disabled = true;
            resultCard.classList.add('rolling');
            let count = 0;
            const totalSteps = 18;
            const timer = setInterval(() => {
                const randomS = students[Math.floor(Math.random() * students.length)];
                resultName.textContent = randomS.name;
                resultDept.textContent = randomS.department || '—';
                count++;
                if (count >= totalSteps) {
                    clearInterval(timer);
                    resultCard.classList.remove('rolling');
                    isRolling = false;
                    finishPick(targetIdx);
                }
            }, 55);
        }

        function finishPick(idx) {
            const picked = students[idx];
            resultName.textContent = picked.name;
            resultDept.textContent = picked.department || '—';

            // 高亮表格
            document.querySelectorAll('#tbody tr').forEach(r => r.classList.remove('picked'));
            const row = document.querySelector(`#tbody tr[data-index="${idx}"]`);
            if (row) {
                row.classList.add('picked', 'already-picked');
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 标记已点
            if (noRepeat.checked) pickedSet.add(idx);

            // 记录
            history.unshift({ name: picked.name, dept: picked.department, time: new Date() });
            if (history.length > 30) history.pop();
            renderHistory();
            updateBadges();

            // 语音
            if (voiceOn.checked) speak(picked.name);

            // 按钮状态
            if (noRepeat.checked && pickedSet.size >= students.length) {
                pickBtn.textContent = '🎉 全部点完 (可重抽)';
            } else {
                pickBtn.textContent = '🎲 随机点名';
            }
            pickBtn.disabled = false;
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = 1.05;
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<span class="empty-history">还没有抽选记录</span>';
                return;
            }
            historyList.innerHTML = '';
            history.forEach((h, i) => {
                const span = document.createElement('span');
                span.className = 'history-item';
                span.innerHTML = `<span class="idx">${history.length - i}.</span>${escapeHtml(h.name)}`;
                span.title = h.dept + ' · ' + h.time.toLocaleTimeString();
                historyList.appendChild(span);
            });
        }

        function resetAll() {
            pickedSet.clear();
            history = [];
            resultName.textContent = '—';
            resultDept.textContent = '等待抽选';
            pickBtn.textContent = '🎲 随机点名';
            pickBtn.disabled = students.length === 0;
            renderHistory();
            updateBadges();
        }

        // ============ 事件 ============
        pickBtn.addEventListener('click', pickRandom);

        noRepeat.addEventListener('change', updateBadges);

        clearHistory.addEventListener('click', () => {
            history = [];
            renderHistory();
        });

        // 空格/回车 快捷键
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (!pickBtn.disabled) pickRandom();
            }
        });

        // 初始化
        pickBtn.disabled = true;
    })();
    </script>
</body>
</html>
